<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
  <title>Poziționare Executivă în Organizații Distribuite: Leadership fără Proximitate Fizică | mariusmarAI</title>
  <meta name="description" content="De ce impactul senior în mediile remote și hibride se bazează pe claritate scrisă, ritmuri operaționale măsurabile și aliniere bazată pe încredere ridicată." />
  <link rel="icon" type="image/jpeg" href="../../mariusmarAI_Logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0B1220;
      --bg-secondary: #111A2E;
      --bg-card: #162238;
      --bg-card-hover: #1C2B47;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --accent: #F59E0B;
      --accent-hover: #D97706;
      --accent-soft: rgba(245, 158, 11, 0.14);
      --cyan: #38BDF8;
      --cyan-soft: rgba(56, 189, 248, 0.12);
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(245, 158, 11, 0.42);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body { max-width: 100%; overflow-x: clip; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    /* Unified Sticky Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: rgba(11, 18, 32, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      width: 100%;
    }
    .header-inner {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0.65rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 0.75rem;
    }
    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--text-primary);
      min-width: 0;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--border-strong);
      flex-shrink: 0;
      display: block;
    }
    .brand-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .brand-title span { color: var(--accent); }
    .hamburger-btn {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }
    .hamburger-btn:hover,
    .hamburger-btn[aria-expanded="true"] {
      border-color: var(--border-strong);
      background: var(--bg-card);
      color: var(--accent);
    }
    .lang-row {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .lang-switcher {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.22rem;
      background: var(--bg-secondary);
      padding: 0.22rem;
      border-radius: 9px;
      border: 1px solid var(--border);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.28rem 0.54rem;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .lang-btn:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.06); }
    .lang-btn.active { background: var(--accent); color: #0B1220; }

    .nav-drawer {
      display: none;
      flex-direction: column;
      gap: 0.35rem;
      width: 100%;
      padding-top: 0.55rem;
      border-top: 1px solid var(--border);
    }
    .nav-drawer.open { display: flex; }
    .nav-link {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.58rem 0.85rem;
      border-radius: 9px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: block;
    }
    .nav-link:hover { color: var(--text-primary); background: var(--bg-card); border-color: var(--border); }
    .nav-link.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: var(--border-strong);
      font-weight: 600;
    }

    @media (max-width: 400px) {
      .header-inner { padding: 0.55rem 0.85rem; gap: 0.45rem; }
      .brand-logo { width: 34px; height: 34px; }
      .brand-title { font-size: 1.02rem; }
      .hamburger-btn { width: 36px; height: 36px; font-size: 1.1rem; }
      .lang-btn { font-size: 0.7rem; padding: 0.24rem 0.44rem; }
    }

    /* Article Layout */
    .article-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4.5rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 1.75rem;
      transition: color 0.2s ease, transform 0.15s ease;
    }
    .back-link:hover {
      color: var(--accent);
      transform: translateX(-2px);
    }

    .article-header {
      margin-bottom: 2rem;
      padding-bottom: 1.75rem;
      border-bottom: 1px solid var(--border);
    }
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 1rem;
    }
    .topic-tag {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.24rem 0.62rem;
      border-radius: 6px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.9rem, 4.2vw, 2.75rem);
      line-height: 1.18;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }
    .article-meta {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* Executive Summary Box */
    .exec-summary {
      background: var(--bg-secondary);
      border-left: 3.5px solid var(--accent);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem 1.6rem;
      margin-bottom: 2.25rem;
    }
    .exec-summary-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.45rem;
    }
    .exec-summary p {
      font-size: 0.96rem;
      color: var(--text-secondary);
      line-height: 1.68;
      margin: 0;
    }

    /* Editorial Typography */
    .article-body p {
      font-size: 1.03rem;
      color: var(--text-secondary);
      margin-bottom: 1.35rem;
    }
    .article-body strong {
      color: var(--text-primary);
      font-weight: 600;
    }
    .article-body h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.4rem, 2.8vw, 1.75rem);
      line-height: 1.28;
      color: var(--text-primary);
      margin: 2.35rem 0 1rem;
    }
    .article-body h3 {
      font-family: 'Inter', sans-serif;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--accent);
      margin: 1.65rem 0 0.55rem;
    }
    .article-body ul,
    .article-body ol {
      margin: 0.75rem 0 1.5rem 1.35rem;
      color: var(--text-secondary);
      font-size: 1.01rem;
    }
    .article-body li {
      margin-bottom: 0.75rem;
      padding-left: 0.25rem;
    }
    .article-body li strong {
      color: var(--text-primary);
    }

    .layer-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.45rem;
      margin-bottom: 1rem;
    }
    .layer-card h3 {
      margin-top: 0;
      margin-bottom: 0.45rem;
    }
    .layer-card p:last-child,
    .layer-card ul:last-child {
      margin-bottom: 0;
    }

    .closing-callout {
      background: var(--bg-secondary);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 1.55rem 1.7rem;
      margin: 2.25rem 0 2.75rem;
    }
    .closing-callout-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.4rem;

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
  <title>mariusmarAI | Terms of Service</title>
  <link rel="icon" type="image/jpeg" href="mariusmarAI_Logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0B1220;
      --bg-secondary: #111A2E;
      --bg-card: #162238;
      --bg-card-hover: #1C2B47;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --accent: #F59E0B;
      --accent-hover: #D97706;
      --accent-soft: rgba(245, 158, 11, 0.14);
      --cyan: #38BDF8;
      --cyan-soft: rgba(56, 189, 248, 0.12);
      --danger-soft: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.42);
      --success: #10B981;
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(245, 158, 11, 0.42);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body { max-width: 100%; overflow-x: clip; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* Unified Sticky Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: rgba(11, 18, 32, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      width: 100%;
    }
    .header-inner {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0.65rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 0.75rem;
    }
    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--text-primary);
      min-width: 0;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--border-strong);
      flex-shrink: 0;
      display: block;
    }
    .brand-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .brand-title span { color: var(--accent); }
    .hamburger-btn {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }
    .hamburger-btn:hover,
    .hamburger-btn[aria-expanded="true"] {
      border-color: var(--border-strong);
      background: var(--bg-card);
      color: var(--accent);
    }
    .lang-row {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .lang-switcher {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.22rem;
      background: var(--bg-secondary);
      padding: 0.22rem;
      border-radius: 9px;
      border: 1px solid var(--border);
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.28rem 0.54rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.06); }
    .lang-btn.active { background: var(--accent); color: #0B1220; }

    .nav-drawer {
      display: none;
      flex-direction: column;
      gap: 0.35rem;
      width: 100%;
      padding-top: 0.55rem;
      border-top: 1px solid var(--border);
    }
    .nav-drawer.open { display: flex; }
    .nav-link {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.58rem 0.85rem;
      border-radius: 9px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: block;
    }
    .nav-link:hover { color: var(--text-primary); background: var(--bg-card); border-color: var(--border); }
    .nav-link.active {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: var(--border-strong);
      font-weight: 600;
    }

    @media (max-width: 400px) {
      .header-inner { padding: 0.55rem 0.85rem; gap: 0.45rem; }
      .brand-logo { width: 34px; height: 34px; }
      .brand-title { font-size: 1.02rem; }
      .hamburger-btn { width: 36px; height: 36px; font-size: 1.1rem; }
      .lang-btn { font-size: 0.7rem; padding: 0.24rem 0.44rem; }
    }

    /* Legal Content */
    .container { max-width: 960px; margin: 0 auto; padding: 2.75rem 1.25rem 4.5rem; }
    .legal-hero { max-width: 840px; margin-bottom: 2.25rem; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--border-strong);
      padding: 0.34rem 0.85rem;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.1rem;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.95rem, 4.3vw, 2.85rem);
      line-height: 1.16;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.85rem;
    }
    .legal-meta {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }
    .legal-meta a { color: var(--cyan); text-decoration: none; }
    .legal-meta a:hover { text-decoration: underline; }

    .legal-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 1.65rem 1.75rem;
      margin-bottom: 1.25rem;
    }
    .legal-section h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.28rem;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 0.65rem;
    }
    .legal-section p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 0.8rem;
    }
    .legal-section p:last-child { margin-bottom: 0; }
    .legal-section a { color: var(--cyan); text-decoration: none; }
    .legal-section a:hover { text-decoration: underline; }
    .clean-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.6rem;
      margin-bottom: 0.3rem;
    }
    .clean-list li {
      position: relative;
      padding-left: 1.25rem;
      font-size: 0.94rem;
      color: var(--text-secondary);
      line-height: 1.65;
    }
    .clean-list li::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 700;
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
      padding: 2.35rem 1.25rem;
      text-align: center;
    }
    .footer-inner { max-width: 960px; margin: 0 auto; }
    .footer-brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
      text-decoration: none;
      color: var(--text-primary);
    }
    .footer-logo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border-strong);
      display: block;
    }
    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.15rem;
      margin-bottom: 1.15rem;
    }
    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .footer-links a:hover { color: var(--accent); }
    .footer-share {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1.25rem;
    }
    .footer-share-label {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-right: 2px;
    }
    .share-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }
    .share-btn:hover {
      border-color: var(--border-strong);
      color: var(--accent);
      background: var(--bg-card-hover);
      transform: translateY(-1px);
    }
    .share-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .footer-copy { font-size: 0.8rem; color: var(--text-muted); }
    .footer-legal-line { margin-top: 0.45rem; }
    .footer-legal-line a { color: inherit; text-decoration: none; transition: color 0.2s ease; }
    .footer-legal-line a:hover { color: var(--accent); text-decoration: underline; }
  </style>

</head>
